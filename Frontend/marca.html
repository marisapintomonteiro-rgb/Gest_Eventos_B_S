<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | Gestão de Eventos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <a class="app-brand" href="marca.html">
            <span class="header-logo" id="headerLogo"></span>
            <span id="headerBrandName"></span>
        </a>

        <nav class="app-nav" aria-label="Navegação principal">
            <a href="marca.html" aria-current="page">Início</a>
            <a href="painel.html">Painel</a>
            <a href="calendario.html">Calendário</a>
            <a href="eventos.html">Eventos</a>
            <a href="vendas.html">Vendas</a>
            <a href="stock.html">Stock</a>
            <a href="ementa.html">Ementa</a>
            <a href="compras.html" data-required-role="Gestor">Compras</a>
            <a href="produtos.html" data-required-role="Gestor">Produtos</a>
            <a href="relatorio.html" data-required-role="Gestor">Relatório</a>
            <a href="utilizadores.html" data-required-role="Administrador">Utilizadores</a>
        </nav>

        <div class="user-area">
            <span class="role-chip" id="headerRole"></span>
            <span class="user-email" id="headerEmail"></span>
            <button class="button button-ghost button-small" type="button" id="logoutButton">Sair</button>
        </div>
    </header>

    <main class="page">
        <!-- Início: o que há para fazer hoje, conforme o perfil -->
        <section class="today-head" aria-labelledby="welcomeTitle">
            <div>
                <p class="today-date" id="todayDate"></p>
                <h1 id="welcomeTitle"></h1>
                <p class="lead" id="welcomeRole"></p>
            </div>
        </section>

        <p id="pageMessage" class="form-message" role="status" hidden></p>

        <!-- O evento de agora (ou o próximo) -->
        <section class="today-event" id="todayEvent" aria-labelledby="todayEventName" hidden>
            <div class="today-stub">
                <span class="today-stub-label" id="todayStubLabel"></span>
                <strong class="today-stub-value" id="todayStubValue"></strong>
                <span class="today-stub-unit" id="todayStubUnit"></span>
            </div>
            <div class="today-event-body">
                <span class="ticket-status" id="todayStatus"></span>
                <h2 id="todayEventName"></h2>
                <p class="today-event-meta" id="todayEventMeta"></p>
                <div class="ticket-days" id="todayDays"></div>
            </div>
        </section>

        <section class="panel today-empty" id="noEventPanel" hidden>
            <h2>Não há eventos marcados</h2>
            <p class="lead" id="noEventText"></p>
            <a class="button" href="eventos.html" data-required-role="Gestor">Planear um evento</a>
        </section>

        <!-- Números do dia -->
        <section class="hero-figures" id="todayFigures" aria-label="Números do evento" hidden></section>

        <div class="today-grid" id="todayGrid" hidden>
            <section class="panel" aria-labelledby="actionsTitle">
                <div class="panel-heading">
                    <h2 id="actionsTitle">Atalhos</h2>
                </div>
                <div class="quick-actions" id="quickActions"></div>
            </section>

            <section class="panel" aria-labelledby="todoTitle">
                <div class="panel-heading">
                    <h2 id="todoTitle">Para tratar</h2>
                    <span class="counter" id="todoCount">0</span>
                </div>
                <ul class="todo-list" id="todoList"></ul>
                <p class="empty-state empty-small" id="todoEmpty" hidden>Está tudo em dia.</p>
            </section>
        </div>

        <p class="session-info" id="sessionInfo"></p>
    </main>

    <footer class="site-footer">
        Bebe e Siga · Gestão de Eventos. Os dados ficam guardados no servidor, numa base de dados MySQL.
    </footer>

    <script src="js/comum.js"></script>
    <script src="js/api.js"></script>
    <script src="js/marca.js"></script>
</body>
</html>
