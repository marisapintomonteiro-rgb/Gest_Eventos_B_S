<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizadores | Gestão de Eventos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <a class="app-brand" href="marca.html">
            <span class="header-logo" id="headerLogo"></span>
            <span id="headerBrandName"></span>
        </a>

        <nav class="app-nav" aria-label="Navegação principal">
            <a href="marca.html">Início</a>
            <a href="utilizadores.html" data-required-role="Administrador" aria-current="page">Utilizadores</a>
        </nav>

        <div class="user-area">
            <span class="role-chip" id="headerRole"></span>
            <span class="user-email" id="headerEmail"></span>
            <button class="button button-ghost button-small" type="button" id="logoutButton">Sair</button>
        </div>
    </header>

    <main class="page">
        <div class="page-heading">
            <h1>Utilizadores</h1>
            <p class="lead" id="teamIntro"></p>
        </div>

        <p id="pageMessage" class="form-message" role="status" hidden></p>

        <div class="users-layout">
            <section class="panel" aria-labelledby="addUserTitle">
                <h2 id="addUserTitle">Adicionar utilizador</h2>

                <form id="userForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" autocomplete="off" placeholder="nome@marca.pt" aria-describedby="emailError" required>
                        <small class="error" id="emailError"></small>
                    </div>

                    <div class="field">
                        <label for="password">Palavra-passe</label>
                        <div class="password-field">
                            <input type="password" id="password" autocomplete="new-password" aria-describedby="passwordError" required>
                            <button type="button" class="toggle-password" data-toggle-password="password" aria-pressed="false">Mostrar</button>
                        </div>
                        <small class="error" id="passwordError"></small>
                    </div>

                    <div class="field">
                        <label for="role">Perfil</label>
                        <select id="role" aria-describedby="roleError" required>
                            <option value="">Escolher perfil</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Gestor">Gestor</option>
                            <option value="Colaborador">Colaborador</option>
                        </select>
                        <small class="error" id="roleError"></small>
                    </div>

                    <button class="button button-block" type="submit">Adicionar utilizador</button>
                </form>
            </section>

            <section class="panel" aria-labelledby="teamTitle">
                <div class="panel-heading">
                    <h2 id="teamTitle">Equipa</h2>
                    <span class="counter" id="userCount">0</span>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Perfil</th>
                                <th>Criado em</th>
                                <th><span class="sr-only">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        Protótipo da Sprint 1. Os dados ficam guardados apenas neste navegador; a versão final vai usar servidor e base de dados MySQL.
    </footer>

    <script src="js/comum.js"></script>
    <script src="js/utilizadores.js"></script>
</body>
</html>
